function bo(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');}

 NHOM.forEach(function(g){ if(chon&&chon!==g) return;

}
document.getElementById('o').addEventListener('input',ve); ve();
